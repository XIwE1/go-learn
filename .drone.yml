# 后端 Go：构建 Linux 二进制 → rsync 到本机目录 → systemctl restart
kind: pipeline
type: docker
name: backend

clone:
  retries: 2

trigger:
  branch:
    - main
  paths:
    include:
      - project/**
      - .drone.yml

# 模块/编译缓存挂宿主机，多次构建复用
volumes:
  - name: go-mod-cache
    host:
      path: /home/drone/cache/go/pkg-mod
  - name: go-build-cache
    host:
      path: /home/drone/cache/go/go-build

steps:
  - name: build
    image: golang:1.24
    volumes:
      - name: go-mod-cache
        path: /cache/gomod
      - name: go-build-cache
        path: /cache/gocache
    environment:
      GOTOOLCHAIN: auto
      # 国内构建 - 避免超时
      GOPROXY: https://goproxy.cn,direct
      GOSUMDB: sum.golang.google.cn
      GOMODCACHE: /cache/gomod
      GOCACHE: /cache/gocache
    commands:
      - set -e
      - mkdir -p bin
      - cd project
      - go version
      - go mod download
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../bin/myproject .

  - name: deploy
    image: drillster/drone-rsync
    network_mode: host
    depends_on:
      - build
    settings:
      hosts:
        - localhost
      user: root
      key:
        from_secret: deploy_ssh_secret
      port: 22
      source: bin/
      target: /opt/myproject

  - name: restart
    image: appleboy/drone-ssh
    network_mode: host
    depends_on:
      - deploy
    settings:
      host: localhost
      username: root
      key:
        from_secret: deploy_ssh_secret
      port: 22
      script:
        - systemctl restart myproject
